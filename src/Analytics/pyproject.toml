[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logregartor-analytics"
version = "0.1.0"
description = "Deterministic anomaly detection for normalized OpenStack logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["uvicorn>=0.30,<1"]

[project.scripts]
logregartor-analytics = "log_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["log_analytics*"]

[tool.setuptools.package-data]
log_analytics = ["sql/*.sql"]
