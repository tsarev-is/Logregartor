services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.3.29.7}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logregartor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --database "$$CLICKHOUSE_DB"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  clickhouse_data:
