services:
  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-clickhouse:8000/mcp}
      MCP_AUTHORIZATION: ${MCP_AUTHORIZATION:-}
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:-}
      ANALYTICS_API_URL: ${ANALYTICS_API_URL:-http://analytics:8080}
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  analytics:
    build: ./src/Analytics
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logregartor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev}
      CLICKHOUSE_TIMEOUT: "8"
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=9).close()"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.3.29.7}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logregartor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --database "$$CLICKHOUSE_DB"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse-init:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.3.29.7}
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logregartor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev}
    entrypoint: ["/bin/bash", "/setup/init-schema.sh"]
    volumes:
      - ./infra/clickhouse/init-schema.sh:/setup/init-schema.sh:ro
      - ./src/LogParser/sql:/schema/logparser:ro
      - ./src/Analytics/log_analytics/sql:/schema/analytics:ro

  mcp-clickhouse-init:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.3.29.7}
    profiles: [mcp]
    restart: "no"
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logregartor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev}
      CLICKHOUSE_MCP_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:-}
    entrypoint: ["/bin/bash", "/setup/init-user.sh"]
    volumes:
      - ./infra/mcp-clickhouse/init-user.sh:/setup/init-user.sh:ro

  mcp-clickhouse:
    build: ./infra/mcp-clickhouse
    profiles: [mcp]
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      mcp-clickhouse-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-logs}
      CLICKHOUSE_USER: logregartor_mcp
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:-}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_ALLOW_WRITE_ACCESS: "false"
      CLICKHOUSE_ALLOW_DROP: "false"
      CHDB_ENABLED: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:-}
      CLICKHOUSE_MCP_ALLOWED_HOSTS: "127.0.0.1:${CLICKHOUSE_MCP_PORT:-8000},localhost:${CLICKHOUSE_MCP_PORT:-8000},127.0.0.1:8000,mcp-clickhouse:8000"
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "30"
      CLICKHOUSE_MCP_MAX_WORKERS: "4"
    ports:
      - "127.0.0.1:${CLICKHOUSE_MCP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

volumes:
  clickhouse_data:
